version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify console env vars are only visible at build time. Write the
        # BEDROCK_* ones into .env.production so the Next.js server (API
        # routes) can read them at runtime. No secrets here: credentials come
        # from the Amplify IAM compute role.
        - env | grep -e BEDROCK_ >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
